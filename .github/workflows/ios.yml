name: iOS app

on:
  push:
    branches: ['**']
    tags: ['ios-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A new push cancels the previous run on the same branch.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS app
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Check injected shim parses
        run: node --check ios/Injected/shim.js

      - name: Build for device (unsigned)
        working-directory: ios
        run: |
          mkdir -p build
          xcodebuild \
            -project aBetterMyGCC.xcodeproj \
            -scheme aBetterMyGCC \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build/device.log 2>&1 || {
              echo "::group::Errors"; grep -E "error:" build/device.log | sort -u | head -60; echo "::endgroup::"
              tail -n 150 build/device.log; exit 1; }
          grep -E "warning:" build/device.log | sort -u | head -40 || true

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          APP=build/device/Build/Products/Release-iphoneos/aBetterMyGCC.app
          test -f "$APP/Extension/manifest.json"
          test -f "$APP/Extension/__ios/shim.js"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          (cd dist && zip -qry aBetterMyGCC-unsigned.ipa Payload)
          ls -lh dist

      - name: Build for Simulator
        working-directory: ios
        run: |
          xcodebuild \
            -project aBetterMyGCC.xcodeproj \
            -scheme aBetterMyGCC \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO \
            build > build/sim.log 2>&1 || {
              echo "::group::Errors"; grep -E "error:" build/sim.log | sort -u | head -60; echo "::endgroup::"
              tail -n 150 build/sim.log; exit 1; }
          DIST="$PWD/dist"
          (cd build/sim/Build/Products/Debug-iphonesimulator && zip -qry "$DIST/aBetterMyGCC-simulator.zip" aBetterMyGCC.app)

      - name: Boot a Simulator
        id: sim
        timeout-minutes: 10
        working-directory: ios
        run: |
          # macOS has no `timeout`; perl's alarm gives every command a hard limit.
          limit() { secs=$1; shift; perl -e 'alarm shift; exec @ARGV' "$secs" "$@"; }
          limit 60 xcrun simctl list devices available -j > devices.json
          UDID=$(python3 -c '
          import json
          devices = json.load(open("devices.json"))["devices"]
          phones = [(rt, d) for rt, ds in devices.items() if "iOS" in rt for d in ds if d["name"].startswith("iPhone")]
          phones.sort(key=lambda t: (t[0], " Pro" in t[1]["name"] and "Max" not in t[1]["name"]))
          rt, d = phones[-1]
          print(d["udid"])
          import sys; print("Using", d["name"], rt, file=sys.stderr)')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Booting $UDID"
          limit 240 xcrun simctl boot "$UDID" || echo "boot returned $? (may already be booted)"
          for i in $(seq 1 60); do
            if limit 20 xcrun simctl list devices | grep "$UDID" | grep -q Booted; then echo "Booted after ${i}x5s"; break; fi
            sleep 5
          done
          # Give SpringBoard a moment to settle after boot.
          sleep 20
          limit 30 xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          echo "Installing app"
          limit 120 xcrun simctl install "$UDID" build/sim/Build/Products/Debug-iphonesimulator/aBetterMyGCC.app

      - name: Screenshots in the Simulator
        timeout-minutes: 15
        working-directory: ios
        run: |
          limit() { secs=$1; shift; perl -e 'alarm shift; exec @ARGV' "$secs" "$@"; }
          UDID=${{ steps.sim.outputs.udid }}
          BUNDLE=io.github.aidanmccants.abettermygcc
          mkdir -p dist/screenshots
          shot() {
            name=$1; wait=$2; shift 2
            echo "== $name: launching $*"
            limit 30 xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            limit 60 xcrun simctl launch "$UDID" "$BUNDLE" "$@" || echo "launch failed ($?)"
            sleep "$wait"
            limit 60 xcrun simctl io "$UDID" screenshot "dist/screenshots/$name.png" || echo "screenshot failed ($?)"
          }
          limit 30 xcrun simctl ui "$UDID" appearance light || true
          shot 1-mygcc 30
          shot 2-settings 15 -gccxOpen settings
          shot 3-options 15 -gccxOpen options
          shot 4-demo-home 20 -gccxOpen demo
          shot 5-demo-home-again 20 -gccxOpen demo
          shot 6-demo-planner 20 -gccxOpen 'demo/index.html?u=%2FICS%2FAcademics%2FHome.jnz%3Fportlet%3DAddDrop_Courses'
          limit 30 xcrun simctl ui "$UDID" appearance dark || true
          shot 7-demo-dark 20 -gccxOpen demo
          shot 8-mygcc-dark 25
          limit 120 xcrun simctl spawn "$UDID" log show --last 15m --style compact \
            --predicate 'process == "aBetterMyGCC" AND eventMessage CONTAINS "[gccx"' > dist/screenshots/app-log.txt || true
          echo "::group::App log"; tail -n 150 dist/screenshots/app-log.txt; echo "::endgroup::"
          ls -l dist/screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aBetterMyGCC-iOS-screenshots
          path: ios/dist/screenshots
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: aBetterMyGCC-iOS-unsigned-ipa
          path: ios/dist/aBetterMyGCC-unsigned.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: aBetterMyGCC-iOS-simulator
          path: ios/dist/aBetterMyGCC-simulator.zip
          if-no-files-found: error

      - name: Attach to release (tags ios-v*)
        if: startsWith(github.ref, 'refs/tags/ios-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ios/dist/aBetterMyGCC-unsigned.ipa
            ios/dist/aBetterMyGCC-simulator.zip
