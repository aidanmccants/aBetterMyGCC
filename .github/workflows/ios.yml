name: iOS app

on:
  push:
    branches: ['**']
    tags: ['ios-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build iOS app
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Check injected shim parses
        run: node --check ios/Injected/shim.js

      - name: Build for device (unsigned)
        working-directory: ios
        run: |
          mkdir -p build
          xcodebuild \
            -project aBetterMyGCC.xcodeproj \
            -scheme aBetterMyGCC \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build/device.log 2>&1 || {
              echo "::group::Errors"; grep -E "error:" build/device.log | sort -u | head -60; echo "::endgroup::"
              tail -n 150 build/device.log; exit 1; }
          grep -E "warning:" build/device.log | sort -u | head -40 || true

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          APP=build/device/Build/Products/Release-iphoneos/aBetterMyGCC.app
          test -f "$APP/Extension/manifest.json"
          test -f "$APP/Extension/__ios/shim.js"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          (cd dist && zip -qry aBetterMyGCC-unsigned.ipa Payload)
          ls -lh dist

      - name: Build for Simulator
        working-directory: ios
        run: |
          xcodebuild \
            -project aBetterMyGCC.xcodeproj \
            -scheme aBetterMyGCC \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO \
            build > build/sim.log 2>&1 || {
              echo "::group::Errors"; grep -E "error:" build/sim.log | sort -u | head -60; echo "::endgroup::"
              tail -n 150 build/sim.log; exit 1; }
          DIST="$PWD/dist"
          (cd build/sim/Build/Products/Debug-iphonesimulator && zip -qry "$DIST/aBetterMyGCC-simulator.zip" aBetterMyGCC.app)

      - name: Screenshots in the Simulator
        working-directory: ios
        run: |
          APP=build/sim/Build/Products/Debug-iphonesimulator/aBetterMyGCC.app
          BUNDLE=io.github.aidanmccants.abettermygcc
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [(rt, d) for rt, ds in devices.items() if "iOS" in rt for d in ds if d["name"].startswith("iPhone")]
          phones.sort(key=lambda t: (t[0], " Pro" in t[1]["name"] and "Max" not in t[1]["name"]))
          print(phones[-1][1]["udid"]); print(phones[-1][1]["name"], phones[-1][0], file=sys.stderr)')
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$UDID" "$APP"
          mkdir -p dist/screenshots
          shot() {
            name=$1; wait=$2; shift 2
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BUNDLE" "$@"
            sleep "$wait"
            xcrun simctl io "$UDID" screenshot "dist/screenshots/$name.png"
          }
          xcrun simctl ui "$UDID" appearance light
          shot 1-mygcc 35
          shot 2-settings 15 -gccxOpen settings
          shot 3-options 15 -gccxOpen options
          shot 4-demo-home 25 -gccxOpen demo
          shot 5-demo-home-again 25 -gccxOpen demo
          shot 6-demo-planner 25 -gccxOpen 'demo/index.html?u=%2FICS%2FAcademics%2FHome.jnz%3Fportlet%3DAddDrop_Courses'
          xcrun simctl ui "$UDID" appearance dark
          shot 7-demo-dark 25 -gccxOpen demo
          shot 8-mygcc-dark 30
          xcrun simctl spawn "$UDID" log show --last 15m --style compact \
            --predicate 'process == "aBetterMyGCC" AND eventMessage CONTAINS "[gccx"' > dist/screenshots/app-log.txt || true
          echo "::group::App log"; tail -n 150 dist/screenshots/app-log.txt; echo "::endgroup::"
          ls -l dist/screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aBetterMyGCC-iOS-screenshots
          path: ios/dist/screenshots
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: aBetterMyGCC-iOS-unsigned-ipa
          path: ios/dist/aBetterMyGCC-unsigned.ipa
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: aBetterMyGCC-iOS-simulator
          path: ios/dist/aBetterMyGCC-simulator.zip
          if-no-files-found: error

      - name: Attach to release (tags ios-v*)
        if: startsWith(github.ref, 'refs/tags/ios-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ios/dist/aBetterMyGCC-unsigned.ipa
            ios/dist/aBetterMyGCC-simulator.zip
