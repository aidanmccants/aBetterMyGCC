<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>aBetterMyGCC</title>
  <link rel="stylesheet" href="../src/theme-engine/fonts.css">
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="../src/theme-engine/shell.css">
  <script src="../src/theme-engine/default-theme.js"></script>
  <script src="../src/theme-engine/runtime.js"></script>
</head>
<body>
  <header>
    <h1>aBetterMyGCC</h1>
    <a href="https://my.gcc.edu/ICS/" target="_blank">Open myGCC</a>
  </header>

  <label class="row"><span>Modern look</span><input type="checkbox" data-key="enabled"></label>
  <label class="row"><span>Hide GPA on Home (press and hold to show)</span><input type="checkbox" data-key="hideGpa"></label>

  <div class="row">
    <span>Appearance</span>
    <div class="seg" role="radiogroup" aria-label="Appearance">
      <button type="button" data-theme="auto">Auto</button>
      <button type="button" data-theme="light">Light</button>
      <button type="button" data-theme="dark">Dark</button>
    </div>
  </div>

  <p class="advanced"><button type="button" class="secondary" id="advanced">Advanced settings</button></p>
  <script src="popup.js"></script>
</body>
</html>
